00/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-images\" aria-hidden=\"true\"><path d=\"m22 11-1.296-1.296a2.4 2.4 0 0 0-3.408 0L11 16\"></path><path d=\"M4 8a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2\"></path><circle cx=\"13\" cy=\"7\" r=\"1\" fill=\"currentColor\"></circle><rect x=\"8\" y=\"2\" width=\"14\" height=\"14\" rx=\"2\"></rect></svg>"}
// Original vector document marks: solid color, folded corner and readable extension.
function fileMark(file){
  const ext=(file.name.split('.').pop()||file.kind||'FILE').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4)||'FILE'
  const type=ext==='PDF'?'pdf':['PNG','JPG','JPEG','WEBP','GIF','SVG'].includes(ext)?'image':['CSV','XLS','XLSX'].includes(ext)?'sheet':['TS','TSX','JS','JSX','JSON','PY','CSS','HTML'].includes(ext)?'code':'text'
  const colors={pdf:'#d75a59',code:'#5086cf',image:'#9470ca',sheet:'#399779',text:'#788598'}
  const symbols={pdf:'<path d="M12 15h9M12 20h15M12 25h11"/>',text:'<path d="M12 15h9M12 20h15M12 25h11"/>',code:'<path d="m15 15-5 5 5 5m10-10 5 5-5 5m-3-11-4 12"/>',image:'<circle cx="14" cy="16" r="2" fill="white" stroke="none"/><path d="m10 27 7-7 4 4 4-5 6 8z" fill="white" stroke="none"/>',sheet:'<path d="M11 14h17v13H11zM11 20h17m-11-6v13"/>'}
  const mark=el('span','file-mark is-'+type)
  mark.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 50" aria-hidden="true"><path d="M7 1h18l13 13v31a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V5a4 4 0 0 1 4-4Z" fill="${colors[type]}"/><path d="M25 1v10a3 3 0 0 0 3 3h10" fill="white" fill-opacity=".3"/><path d="m25 14 13 8v-8Z" fill="black" fill-opacity=".08"/><g stroke="white" stroke-opacity=".9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none">${symbols[type]}</g><text x="20.5" y="41" text-anchor="middle" fill="white" font-family="Inter,system-ui,sans-serif" font-weight="750" font-size="${ext.length>3?9:11}" letter-spacing=".3">${ext}</text></svg>`
  return mark
}
const samplePdf={name:'onboarding-brief.pdf',kind:'PDF',size:'184 KB',sample:true}
const sampleCode={name:'invite.ts',kind:'TS',size:'1.2 KB',text:`type Invite = { email: string; role: 'member' | 'admin' }

export async function inviteMember(invite: Invite) {
  const response = await fetch('/api/invites', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(invite)
  })

  if (!response.ok) throw new Error('Invite could not be sent')
  return response.json()
}
`}
let mode='draft',files=[],input,transcript,tray,pane,selected=null
const stage=document.querySelector('#stage'),status=document.querySelector('#status')
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function card(file,removable=false){const c=el('div','file-card'),b=el('button','file-open');b.setAttribute('aria-label','Preview '+file.name);const mark=fileMark(file),copy=el('span','file-copy');copy.append(el('b','',file.name),el('small','',file.kind+' · '+file.size));b.append(mark,copy);b.onclick=()=>openPreview(file);c.append(b);if(removable){const x=el('button','remove');x.innerHTML=icons.x;x.setAttribute('aria-label','Remove '+file.name);x.onclick=()=>{files=files.filter(f=>f!==file);drawTray()};c.append(x)}return c}
function drawTray(){tray.replaceChildren(...files.map(f=>card(f,true)));document.querySelector('#send').disabled=!files.length&&!input.value.trim()}
function openPreview(file){selected=file;document.querySelector('.document-preview')?.remove();const preview=el('aside','document-preview');preview.setAttribute('aria-label','File preview');const head=el('div','preview-head'),close=el('button','','Close');close.onclick=()=>{preview.remove();selected=null};const title=el('div','preview-title');title.append(fileMark(file),el('b','',file.name));head.append(title,close);preview.append(head,el('div','preview-meta',file.kind+' · '+file.size+' · '+(file.error?'Preview unavailable':'Preview')));const body=el('div','preview-content');if(file.error){body.append(el('div','file-error','This PDF is password protected. Attach an unlocked copy to continue.'));body.append(el('p','demo-note','Your prompt and other attachments stay in the draft.'))}else if(file.sample){const paper=el('article','paper');paper.innerHTML='<div class="document-label">NORTHSTAR / PRODUCT BRIEF</div><h2>A simpler way to<br>invite your team.</h2><p>Help workspace owners invite their first teammate without leaving the setup flow.</p><h3>What success looks like</h3><ul><li>Invite by email from the welcome screen.</li><li>Explain the member and admin roles.</li><li>Show clear sent and pending states.</li></ul><h3>Scope for the first release</h3><p>One invitation at a time. Keep the email available if sending fails. Make the next step clear after success.</p><h3>Review question</h3><p>Does the implementation handle a failed request without losing the invite?</p>';body.append(paper)}else if(file.kind==='PDF'){const frame=el('iframe');frame.src=file.url;frame.title='PDF preview: '+file.name;body.append(frame)}else if(file.kind==='IMAGE'){const image=el('img');image.src=file.url;image.alt=file.name;body.append(image)}else body.append(el('pre','',file.text??''));preview.append(body,el('div','preview-footer',file.sample?'Sample PDF preview · Page 1 of 1':file.error?'Unlock the original, then attach it again.':'Original file retained · text is never executed'));stage.append(preview)}
function sendMessage(text,attached){const message=el('div','user-message');if(attached.length){const row=el('div','file-tray');attached.forEach(f=>row.append(card(f)));message.append(row)}if(text.trim())message.append(el('div','bubble',text));transcript.append(message);transcript.scrollTop=transcript.scrollHeight}
async function addFiles(list){let rejected=0;for(const file of list){if(file.size>25*1024*1024||files.length>=10){rejected++;continue}const ext=file.name.split('.').pop().toLowerCase(),kind=file.type.startsWith('image/')?'IMAGE':ext==='pdf'?'PDF':ext.toUpperCase();if(!['IMAGE','PDF','TXT','MD','TS','TSX','JS','JSX','JSON','PY','CSS','HTML','CSV','LOG'].includes(kind)){rejected++;continue}files.push({name:file.name,kind,size:file.size<1024?file.size+' B':Math.ceil(file.size/1024)+' KB',url:URL.createObjectURL(file),text:kind!=='PDF'&&kind!=='IMAGE'?(await file.text()).slice(0,60000):null})}drawTray();status.textContent=rejected?'Some files were skipped. This mockup accepts up to 10 supported files, 25 MB each.':'Files added to this draft. Preview them before sending.'}
function render(){stage.replaceChildren();files=mode==='sent'?[]:mode==='error'?[{name:'protected-brief.pdf',kind:'PDF',size:'210 KB',error:true},sampleCode]:[samplePdf,sampleCode];pane=el('section','pane');pane.setAttribute('aria-label','Review onboarding');pane.innerHTML=`<div class="pane-title"><b>Review onboarding</b><span>Rocket</span></div><div class="transcript"><div class="assistant"><div class="meta">Claude</div><p>Attach the brief and the implementation, and I can compare them.</p></div></div><div class="dock"><div class="tabs"><span class="tab">Review onboarding</span></div><div class="composer"><div class="file-tray"></div><div class="input-row"><span class="split-icon">${icons.chats}</span><textarea aria-label="Message" placeholder="Reply…"></textarea></div><div class="bar"><button class="attach" aria-label="Attach files" title="Attach files">${icons.clip}</button><span class="folder">${icons.folder}Desktop/rocketv1</span><span class="model">Claude</span><button class="send" id="send" aria-label="Send">${icons.up}</button></div><div class="hint"></div><input type="file" multiple hidden></div></div>`;stage.append(pane);input=pane.querySelector('textarea');transcript=pane.querySelector('.transcript');tray=pane.querySelector('.file-tray');input.value=mode==='sent'?'':'Does this implementation cover the brief?';input.oninput=drawTray;const picker=pane.querySelector('input');pane.querySelector('.attach').onclick=()=>picker.click();picker.onchange=()=>{addFiles(Array.from(picker.files));picker.value=''};pane.ondragover=e=>{if(e.dataTransfer.types.includes('Files')){e.preventDefault();pane.style.outline='1px dashed #7170ff'}};pane.ondragleave=()=>pane.style.outline='';pane.ondrop=e=>{e.preventDefault();pane.style.outline='';addFiles(Array.from(e.dataTransfer.files))};input.onpaste=e=>{if(e.clipboardData.files.length){e.preventDefault();addFiles(Array.from(e.clipboardData.files))}};pane.querySelector('#send').onclick=()=>{if(files.some(f=>f.error)){pane.querySelector('.hint').textContent='Remove or replace the locked PDF before sending.';pane.querySelector('.hint').classList.add('error');return}sendMessage(input.value,files);input.value='';files=[];drawTray();status.textContent='Message shown locally. No files were sent to a model.'};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();pane.querySelector('#send').click()}};drawTray();if(mode==='sent')sendMessage('Does this implementation cover the brief?',[samplePdf,sampleCode]);openPreview(mode==='error'?files[0]:samplePdf);document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===mode)));document.querySelector('#note').textContent=mode==='sent'?'Files and prompt remain separate. Click either file to inspect it.':mode==='error'?'An unreadable document has an explicit recovery action; the rest of the draft stays intact.':'Click a card to switch between document and code previews. The paperclip and file drop work locally.'}
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{mode=b.dataset.state;render()});document.querySelector('#reset').onclick=render;document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelector('.document-preview')?.remove();selected=null}});render()
</script></html>
