<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocket · Images in chat</title>
<style>
@font-face{font-family:Inter;src:url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2')}
:root{color-scheme:dark;--canvas:#08090a;--panel:#0f1011;--composer:#151617;--line:#2f3031;--text:#f7f8f8;--muted:#8a8f98;--accent:#7170ff}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--text);font:13px/1.5 Inter,system-ui,sans-serif}button,textarea{font:inherit}button{cursor:pointer;color:inherit;background:transparent;border:0}button:hover{background:#ffffff0b}button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.3;cursor:default}svg{width:16px;height:16px;vertical-align:middle;flex-shrink:0}header{max-width:1260px;margin:auto;padding:28px 28px 20px}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}h1{font-size:25px;letter-spacing:-.7px;font-weight:550;margin:6px 0}header p{color:#b4b8c0;margin:0}.nav{display:flex;gap:5px;flex-wrap:wrap;margin-top:22px}.nav button{padding:8px 13px;border-radius:7px;color:#a4a8b0;border:1px solid transparent}.nav button[aria-pressed=true]{background:#1c1d20;border-color:var(--line);color:var(--text)}main{max-width:1260px;padding:0 28px 24px;margin:auto}.stage{display:flex;gap:8px;min-height:490px;height:calc(100vh - 285px);max-height:700px}.pane{position:relative;display:flex;flex-direction:column;min-width:0;flex:1;background:linear-gradient(#ffffff03,transparent 140px),var(--panel);border:1px solid #ffffff13;border-radius:12px;overflow:hidden}.pane-title{padding:14px 20px;border-bottom:1px solid #ffffff09;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}.pane-title b{font-weight:500;color:#c8cbd0}.transcript{flex:1;min-height:90px;overflow:auto;padding:24px 26px}.bubble{margin:0 0 22px auto;max-width:85%;width:fit-content;padding:10px 13px;background:#1c1d20;border-radius:10px}.assistant{color:#d7d9de;max-width:520px}.assistant p{margin:8px 0 16px}.meta{font-size:11px;color:#71767f}.tool{color:var(--muted);font-size:12px;margin:9px 0}.dock{padding:12px 18px 18px}.tabs{display:flex;gap:13px;align-items:center;height:29px;padding-left:10px;color:var(--muted);font-size:11px}.tab{background:var(--composer);border:1px solid var(--line);border-bottom:0;padding:6px 13px;border-radius:8px 8px 0 0;transform:translateY(1px);color:#d7d9de}.composer{background:var(--composer);border:1px solid var(--line);border-radius:12px}.composer:focus-within{border-color:#444546}.attachments{display:flex;gap:9px;overflow-x:auto;padding:12px 12px 0}.attachments:empty{display:none}.attachment{position:relative;flex:0 0 104px;min-width:0}.thumb{display:block;padding:0;width:104px;height:68px;overflow:hidden;border:0;border-radius:7px;background:transparent}.thumb img{width:100%;height:100%;object-fit:contain;display:block}.filename{display:block;color:#a4a8b0;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-top:4px}.remove{position:absolute;top:-5px;right:-5px;border:1px solid #494a4c;background:#252628;border-radius:50%;width:21px;height:21px;padding:0;line-height:0;display:grid;place-items:center}.remove svg{display:block;width:12px;height:12px;margin:0}.input-row{display:flex;align-items:flex-start;padding:10px 10px 0;gap:6px}.split-icon{color:#737880;padding:4px}.input-row textarea{min-width:0;resize:vertical;min-height:48px;max-height:130px;width:100%;border:0;background:none;color:var(--text);padding:3px 3px;outline:none;line-height:1.6}.input-row textarea::placeholder{color:#62666d}.bar{display:flex;align-items:center;gap:8px;padding:6px 10px 9px}.attach{height:28px;width:28px;border-radius:6px;color:#b4b8c0}.folder{font-size:11px;color:#737880;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.folder svg{width:13px;margin-right:5px}.model{color:#9ca1aa;font-size:11px;white-space:nowrap}.send{width:28px;height:28px;border-radius:50%;background:#e6e6e6;color:#08090a}.send:hover{background:white}.hint{font-size:10px;color:var(--muted);padding:0 12px 9px}.hint:empty{display:none}.error{color:#ef9c92}.drop-overlay{position:absolute;inset:7px;border:1px dashed #9896ff;border-radius:9px;display:none;place-content:center;text-align:center;background:#12121bef;z-index:3;pointer-events:none}.dropping .drop-overlay{display:grid}.drop-overlay svg{width:30px;height:30px;margin:0 auto 14px;color:#a5a3ff}.drop-overlay strong{font-size:17px;font-weight:500}.drop-overlay span{color:#a6a8b4;margin-top:6px;font-size:12px}.drop-overlay small{margin-top:22px;color:#777b87}.queued{margin:20px 0 0 auto;max-width:90%;width:fit-content}.queued .bubble{background:transparent;border:1px dashed #424348;margin:0;max-width:100%}.sent-images{display:flex;gap:8px;margin-bottom:9px;flex-wrap:wrap}.sent-images .thumb{width:150px;height:95px}.queue-actions{display:flex;justify-content:flex-end;gap:7px;font-size:10px;color:var(--muted);margin-top:6px}.queue-actions button{color:#c5c7cd;padding:0 3px}.note{display:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:12px;margin-top:16px}.note p{margin:0;max-width:740px}.note strong{color:#c4c7ce;font-weight:500}.note button{white-space:nowrap;border:1px solid var(--line);padding:6px 10px;border-radius:6px;align-self:start}dialog{background:#121315;color:var(--text);border:1px solid #38393c;border-radius:12px;max-width:90vw;padding:16px}dialog::backdrop{background:#000c}dialog img{max-width:82vw;max-height:75vh;object-fit:contain;display:block}dialog .dialogbar{display:flex;justify-content:space-between;margin-bottom:10px;gap:25px}#status{font-size:11px;color:#a4a8b0;margin-top:10px;min-height:17px}@media(max-width:700px){header{padding:18px 14px}main{padding:0 14px 20px}.stage{height:auto;min-height:500px;flex-direction:column;max-height:none}.pane{min-height:430px}.transcript{padding:20px 16px}.dock{padding:10px}.note{flex-direction:column}.model{font-size:10px}h1{font-size:22px}}
</style>
<header><div class="eyebrow">Rocket / Interaction mockups</div><h1>Images belong in the conversation.</h1><p>Paste, choose files, or drop them into the chat you want.</p><nav class="nav" aria-label="Mockup states"><button data-state="draft" aria-pressed="true">01 · Attach & preview</button><button data-state="split" aria-pressed="false">02 · Drop into a chat</button><button data-state="queued" aria-pressed="false">03 · While a reply runs</button></nav></header>
<main><div class="stage" id="stage"></div><div class="note"><p id="note"></p><button id="reset">Reset this mockup</button></div><div id="status" role="status" aria-live="polite"></div></main>
<dialog id="preview"><div class="dialogbar"><span id="preview-name"></span><button id="close-preview" aria-label="Close image preview">Close</button></div><img alt="Enlarged attachment" id="preview-image"></dialog>
<script>
const icons = {"clip":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-paperclip\" aria-hidden=\"true\"><path d=\"m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551\"></path></svg>","folder":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-folder\" aria-hidden=\"true\"><path d=\"M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z\"></path></svg>","up":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-up\" aria-hidden=\"true\"><path d=\"m5 12 7-7 7 7\"></path><path d=\"M12 19V5\"></path></svg>","x":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-x\" aria-hidden=\"true\"><path d=\"M18 6 6 18\"></path><path d=\"m6 6 12 12\"></path></svg>","chats":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-message-square-plus\" aria-hidden=\"true\"><path d=\"M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z\"></path><path d=\"M12 8v6\"></path><path d=\"M9 11h6\"></path></svg>","images":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-images\" aria-hidden=\"true\"><path d=\"m22 11-1.296-1.296a2.4 2.4 0 0 0-3.408 0L11 16\"></path><path d=\"M4 8a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2\"></path><circle cx=\"13\" cy=\"7\" r=\"1\" fill=\"currentColor\"></circle><rect x=\"8\" y=\"2\" width=\"14\" height=\"14\" rx=\"2\"></rect></svg>"}
const examples=[{name:'rocket-layout.png',url:'image-attachments-assets/rocket.png'},{name:'linear-reference.jpg',url:'../../design-library/references/linear/images/refero-linear.jpg'}]
let state='draft',panes=[],showDrop=true
const stage=document.querySelector('#stage'),status=document.querySelector('#status')
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function icon(name){const s=el('span');s.innerHTML=icons[name];return s}
function preview(file){document.querySelector('#preview-image').src=file.url;document.querySelector('#preview-name').textContent=file.name;document.querySelector('#preview').showModal()}
document.querySelector('#close-preview').onclick=()=>document.querySelector('#preview').close()
function imageButton(file){const b=el('button','thumb');b.setAttribute('aria-label','Preview '+file.name);const img=el('img');img.src=file.url;img.alt=file.name;b.append(img);b.onclick=()=>preview(file);return b}
function sent(message,files,queued=false){const box=el('div','bubble');if(files.length){const row=el('div','sent-images');files.forEach(f=>row.append(imageButton(f)));box.append(row)}if(message)box.append(el('div','',message));return box}
function thumbnails(p){p.tray.replaceChildren();p.files.forEach((f,i)=>{const a=el('div','attachment'),remove=el('button','remove');remove.innerHTML=icons.x;remove.setAttribute('aria-label','Remove '+f.name);remove.onclick=()=>{p.files.splice(i,1);thumbnails(p)};a.append(imageButton(f),remove,el('span','filename',f.name));p.tray.append(a)});p.send.disabled=!p.files.length&&!p.input.value.trim()}
async function addFiles(p,files){p.section.classList.remove('dropping');const accepted=[...files].filter(f=>['image/png','image/jpeg','image/webp','image/gif'].includes(f.type)&&f.size<=20*1024*1024);p.files.push(...accepted.map(f=>({name:f.name,url:URL.createObjectURL(f)})));thumbnails(p);p.hint.classList.toggle('error',accepted.length!==files.length);p.hint.textContent=accepted.length!==files.length?'Choose PNG, JPEG, WebP or GIF images under 20 MB.':'';status.textContent=accepted.length+' image'+(accepted.length===1?'':'s')+' added to '+p.name+'.';p.input.focus()}
function makePane(name,provider,files,text,busy=false){const section=el('section','pane');section.setAttribute('aria-label',name);section.innerHTML=`<div class="pane-title"><b></b><span>${busy?'Working · 24s':'Rocket'}</span></div><div class="transcript"><div class="assistant"><div class="meta">${provider}</div><p>${busy?'I’m updating the spacing and colors in the chat layout.':'Send the current screen and a reference so I can compare the layout.'}</p>${busy?'<div class="tool">Reading src/renderer/src/styles.css</div><div class="tool">Checking the composer spacing…</div>':''}</div></div><div class="dock"><div class="tabs"><span class="tab"></span><span>New chat</span></div><div class="composer"><div class="attachments"></div><div class="input-row"><span class="split-icon">${icons.chats}</span><textarea aria-label="Message" placeholder="Reply…"></textarea></div><div class="bar"><button class="attach" aria-label="Attach images" title="Attach images">${icons.clip}</button><span class="folder">${icons.folder}Desktop/rocketv1</span><span class="model">${provider}</span><button class="send" aria-label="Send">${icons.up}</button></div><div class="hint"></div><input type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden></div></div><div class="drop-overlay">${icons.images}<strong>Add images to this chat</strong><span></span><small>Release to attach · send when you’re ready</small></div>`;
section.querySelector('.pane-title b').textContent=name;section.querySelector('.tab').textContent=name;section.querySelector('.drop-overlay span').textContent=name;
const p={section,name,files:[...files],busy,input:section.querySelector('textarea'),tray:section.querySelector('.attachments'),send:section.querySelector('.send'),hint:section.querySelector('.hint'),transcript:section.querySelector('.transcript')};p.input.value=text;p.input.oninput=()=>thumbnails(p);const picker=section.querySelector('input');section.querySelector('.attach').onclick=()=>picker.click();picker.onchange=()=>{addFiles(p,picker.files);picker.value=''};
p.input.onpaste=e=>{const fs=[...e.clipboardData.items].filter(x=>x.kind==='file').map(x=>x.getAsFile()).filter(Boolean);if(fs.length){e.preventDefault();addFiles(p,fs)}};
section.ondragover=e=>{if(e.dataTransfer.types.includes('Files')){e.preventDefault();section.classList.add('dropping')}};section.ondragleave=e=>{if(!section.contains(e.relatedTarget))section.classList.remove('dropping')};section.ondrop=e=>{e.preventDefault();addFiles(p,e.dataTransfer.files)};
p.send.onclick=()=>{if(p.send.disabled)return;const text=p.input.value.trim(),files=[...p.files];p.files=[];p.input.value='';thumbnails(p);if(p.busy){queue(p,text,files)}else{p.transcript.append(sent(text,files));status.textContent='Message shown in '+name+'. This mockup does not contact a model.'}p.transcript.scrollTop=p.transcript.scrollHeight};p.input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();p.send.click()}};thumbnails(p);stage.append(section);return p}
function queue(p,text,files){const q=el('div','queued'),actions=el('div','queue-actions');q.append(sent(text,files));actions.append(el('span','','Sends when the reply finishes'));const edit=el('button','','Edit'),now=el('button','','Send now');edit.onclick=()=>{p.files.unshift(...files);p.input.value=text+(p.input.value?'\n\n'+p.input.value:'');q.remove();thumbnails(p);p.input.focus();status.textContent='Text and images restored to the draft.'};now.onclick=()=>{p.busy=false;q.replaceWith(sent(text,files));status.textContent='Mock reply stopped; queued message sent.'};actions.append(edit,now);q.append(actions);p.transcript.append(q)}
const notes={draft:'<strong>One attachment tray, three ways in.</strong> Try the paperclip, paste a screenshot, or drop a file. Click a thumbnail to enlarge it; remove an image without losing your text.',split:'<strong>The pane under the pointer receives the images.</strong> The drop target names the chat. Each composer keeps its own draft; attaching never sends automatically.',queued:'<strong>Images stay with their message.</strong> While a reply runs, attachments wait for the next turn. Edit brings both images and text back into the composer.'}
function render(){stage.replaceChildren();status.textContent='Interactive mockup · files stay in this page · no model calls';document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===state)));document.querySelector('#note').innerHTML=notes[state];if(state==='draft')panes=[makePane('Chat layout','Claude',examples,'Use the second image as a reference for this layout.')];if(state==='split'){panes=[makePane('Chat layout','Claude',[examples[0]],'Compare this with the reference.'),makePane('Settings screen','Codex',[],'')];if(showDrop)panes[1].section.classList.add('dropping');panes[1].section.onclick=()=>panes[1].section.classList.remove('dropping')};if(state==='queued'){const p=makePane('Chat layout','Cursor',[],'',true);queue(p,'Here’s the reference for the spacing.',[examples[1]]);p.hint.textContent='New images will send when this reply finishes.';panes=[p]}}
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;render()});document.querySelector('#reset').onclick=render;render()
</script>
</html>
