<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Experiments — Rocket Evals (mock)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #09090b;
      --bg-elevated: #0c0c0f;
      --bg-hover: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #3b82f6;
      --pass: #22c55e;
      --fail: #ef4444;
      --chip-bg: #18181b;
      --sidebar-w: 220px;
      --radius: 8px;
      --font: 'Inter', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    .sidebar {
      width: var(--sidebar-w);
      background: var(--bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      padding: 12px 8px;
    }
    .org-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      font-weight: 600;
      font-size: 14px;
    }
    .project-select {
      margin: 8px 8px 16px;
      padding: 8px 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      width: calc(100% - 16px);
    }
    .nav-section { margin-bottom: 8px; }
    .nav-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 8px 12px 4px;
    }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .nav-link:hover { background: var(--bg-hover); color: var(--text); }
    .nav-link.active { background: var(--bg-hover); color: var(--text); font-weight: 500; }
    .nav-link svg { width: 16px; height: 16px; opacity: 0.7; flex-shrink: 0; }
    .sidebar-footer {
      margin-top: auto;
      padding: 12px 8px;
      border-top: 1px solid var(--border);
    }
    .plan-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .plan-card strong { display: block; color: var(--text); margin-bottom: 4px; }
    .plan-card a { color: var(--accent); font-size: 12px; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      gap: 16px;
    }
    .topbar h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .topbar-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn {
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      cursor: pointer;
    }
    .btn:hover { background: var(--bg-hover); }
    .btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 500; }
    .btn-primary:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .chip-group {
      display: inline-flex;
      background: var(--chip-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
    }
    .chip {
      padding: 5px 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .chip.active { background: var(--bg-hover); color: var(--text); font-weight: 500; }
    .content { padding: 0 24px 32px; flex: 1; overflow: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    tr.clickable { cursor: pointer; }
    .score { font-variant-numeric: tabular-nums; }
    .score-good { color: var(--pass); }
    .score-bad { color: var(--fail); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge-pass { background: rgba(34,197,94,0.15); color: var(--pass); }
    .badge-fail { background: rgba(239,68,68,0.15); color: var(--fail); }
    .badge-kind { background: var(--bg-hover); color: var(--muted); }
    .grid-layout {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      background: var(--bg-elevated);
    }
    .card h3 { margin: 0 0 8px; font-size: 14px; }
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .metric {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      background: var(--bg-elevated);
    }
    .metric .label { color: var(--muted); font-size: 12px; }
    .metric .value { font-size: 28px; font-weight: 600; margin-top: 4px; }
    .compare-banner {
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: var(--radius);
      padding: 10px 14px;
      margin: 16px 0;
      display: none;
    }
    .compare-banner.visible { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .mono { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
    .hidden { display: none !important; }
    .breadcrumb { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .breadcrumb button {
      background: none; border: none; color: var(--accent); cursor: pointer; padding: 0;
    }
    input[type="file"] { display: none; }
    .filter-input {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      min-width: 200px;
    }
    .summary-table th:first-child { position: sticky; left: 0; background: var(--bg); }
  </style>
</head>
<body>
  <aside class="sidebar" aria-label="Project navigation">
    <div class="org-row">
      <span>rocketv1</span>
    </div>
    <select class="project-select" id="projectSelect" aria-label="Project">
      <option>Rocket Evals (mock)</option>
    </select>
    <nav class="nav-section">
      <div class="nav-label">Monitor</div>
      <button type="button" class="nav-link" data-view="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Overview</button>
      <button type="button" class="nav-link" data-view="logs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19h16M4 12h16M4 5h16"/></svg>Logs</button>
    </nav>
    <nav class="nav-section">
      <div class="nav-label">Evaluate</div>
      <button type="button" class="nav-link" data-view="playgrounds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Playgrounds</button>
      <button type="button" class="nav-link active" data-view="experiments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6v7l5 9H4l5-9V3z"/></svg>Experiments</button>
      <button type="button" class="nav-link" data-view="datasets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>Datasets</button>
      <button type="button" class="nav-link" data-view="scorers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4 2 7-6.5-4.5L5.5 20l2-7L2 9h7z"/></svg>Scorers</button>
    </nav>
    <div class="sidebar-footer">
      <div class="plan-card">
        <strong>Local mock</strong>
        Mirrors Braintrust Experiments / Datasets layout. Not connected to braintrust.dev API.
        <br /><a href="https://www.braintrust.dev/app/rocketv1/p/My%20Project/experiments" target="_blank" rel="noopener">Open real Braintrust →</a>
      </div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <div class="breadcrumb" id="breadcrumb"></div>
        <h1 id="pageTitle">Experiments</h1>
      </div>
      <div class="topbar-actions">
        <label class="btn" for="fileLoad">Load JSON</label>
        <input type="file" id="fileLoad" accept="application/json,.json" />
        <button type="button" class="btn" id="btnSyncHint" title="Run npm run eval:mock-ui:sync">Refresh live-data</button>
        <button type="button" class="btn btn-primary" id="btnNewExperiment">+ Experiment</button>
      </div>
    </header>

    <div class="toolbar" id="experimentsToolbar">
      <div class="chip-group" role="group" aria-label="Layout">
        <button type="button" class="chip active" data-layout="list">List</button>
        <button type="button" class="chip" data-layout="grid">Grid</button>
        <button type="button" class="chip" data-layout="summary">Summary</button>
        <button type="button" class="chip" data-layout="summary-table">Summary table</button>
      </div>
      <input type="search" class="filter-input" id="expFilter" placeholder="Filter experiments…" />
      <button type="button" class="btn" id="btnCompare" disabled>Compare</button>
    </div>

    <div class="toolbar hidden" id="datasetsToolbar">
      <button type="button" class="btn">Import</button>
      <button type="button" class="btn">Row</button>
      <input type="search" class="filter-input" id="datasetFilter" placeholder="Add filter…" />
      <button type="button" class="btn">Display</button>
    </div>

    <div class="content">
      <div class="compare-banner" id="compareBanner">
        <span id="compareText">Select two experiments to compare.</span>
        <button type="button" class="btn" id="btnClearCompare">Clear</button>
      </div>
      <div id="viewRoot"></div>
    </div>
  </main>

  <script>
    /** @type {{ project: string, datasets: any[], experiments: any[] }} */
    let state = { project: '', datasets: [], experiments: [] }
    let view = 'experiments'
    let layout = 'list'
    /** @type {string|null} */
    let selectedExperimentId = null
    /** @type {Set<string>} */
    const compareIds = new Set()

    const pct = (n) => `${Math.round(n * 100)}%`
    const fmtDate = (iso) => iso ? new Date(iso).toLocaleString() : '—'

    async function loadData() {
      try {
        const live = await fetch('live-data.json', { cache: 'no-store' })
        if (live.ok) return live.json()
      } catch { /* file:// or no sync yet */ }
      const sample = await fetch('sample-data.json')
      return sample.json()
    }

    function setView(next) {
      view = next
      document.querySelectorAll('.nav-link').forEach((el) => {
        el.classList.toggle('active', el.dataset.view === next)
      })
      document.getElementById('experimentsToolbar').classList.toggle('hidden', next !== 'experiments' && next !== 'experiment-detail')
      document.getElementById('datasetsToolbar').classList.toggle('hidden', next !== 'datasets' && next !== 'dataset-detail')
      const titles = {
        overview: 'Overview',
        logs: 'Logs',
        playgrounds: 'Playgrounds',
        experiments: 'Experiments',
        'experiment-detail': 'Experiment',
        datasets: 'Datasets',
        'dataset-detail': 'Dataset',
        scorers: 'Scorers'
      }
      document.getElementById('pageTitle').textContent = titles[next] ?? next
      render()
    }

    function getExperiment(id) {
      return state.experiments.find((e) => e.id === id)
    }

    function getDataset(id) {
      return state.datasets.find((d) => d.id === id)
    }

    function renderExperimentsList() {
      const filter = document.getElementById('expFilter').value.toLowerCase()
      const rows = state.experiments.filter((e) => e.name.toLowerCase().includes(filter))

      if (layout === 'summary') {
        const avgPass = rows.length ? rows.reduce((s, e) => s + e.passRate, 0) / rows.length : 0
        return `<div class="summary-cards">
          <div class="metric"><div class="label">Experiments</div><div class="value">${rows.length}</div></div>
          <div class="metric"><div class="label">Avg pass rate</div><div class="value score-good">${pct(avgPass)}</div></div>
          <div class="metric"><div class="label">Matrix runs</div><div class="value">${rows.filter((e) => e.kind === 'matrix').length}</div></div>
          <div class="metric"><div class="label">Harness runs</div><div class="value">${rows.filter((e) => e.kind === 'harness').length}</div></div>
        </div>`
      }

      if (layout === 'summary-table') {
        const scoreKeys = [...new Set(rows.flatMap((e) => Object.keys(e.scores ?? {})))]
        return `<table class="summary-table"><thead><tr><th>Metric</th>${rows.map((e) => `<th>${escapeHtml(e.name)}</th>`).join('')}</tr></thead><tbody>
          <tr><td>Pass rate</td>${rows.map((e) => `<td class="score score-good">${pct(e.passRate)}</td>`).join('')}</tr>
          <tr><td>Cells</td>${rows.map((e) => `<td>${e.cellCount}</td>`).join('')}</tr>
          ${scoreKeys.map((k) => `<tr><td>${escapeHtml(k)}</td>${rows.map((e) => `<td>${e.scores?.[k] != null ? pct(e.scores[k]) : '—'}</td>`).join('')}</tr>`).join('')}
        </tbody></table>`
      }

      if (layout === 'grid') {
        return `<div class="grid-layout">${rows.map((e) => `
          <article class="card clickable" data-exp="${e.id}">
            <h3>${escapeHtml(e.name)}</h3>
            <div class="badge badge-kind">${e.kind}</div>
            <p class="score score-${e.passRate >= 0.8 ? 'good' : 'bad'}" style="margin:12px 0 4px;font-size:22px;font-weight:600">${pct(e.passRate)}</p>
            <p class="mono">${e.passCount}/${e.cellCount} cells · ${fmtDate(e.createdAt)}</p>
          </article>`).join('')}</div>`
      }

      return `<table><thead><tr>
        <th></th><th>Name</th><th>Dataset</th><th>Pass rate</th><th>Cells</th><th>Created</th><th>Kind</th>
      </tr></thead><tbody>${rows.map((e) => `
        <tr class="clickable" data-exp="${e.id}">
          <td><input type="checkbox" data-compare="${e.id}" ${compareIds.has(e.id) ? 'checked' : ''} onclick="event.stopPropagation()" /></td>
          <td>${escapeHtml(e.name)}</td>
          <td><span class="mono">${escapeHtml(e.datasetId)}</span></td>
          <td class="score score-${e.passRate >= 0.8 ? 'good' : 'bad'}">${pct(e.passRate)}</td>
          <td>${e.passCount}/${e.cellCount}</td>
          <td>${fmtDate(e.createdAt)}</td>
          <td><span class="badge badge-kind">${e.kind}</span></td>
        </tr>`).join('')}</tbody></table>`
    }

    function renderExperimentDetail() {
      const exp = getExperiment(selectedExperimentId)
      if (!exp) return '<p>Experiment not found.</p>'
      document.getElementById('breadcrumb').innerHTML =
        `<button type="button" id="backExperiments">Experiments</button> / ${escapeHtml(exp.name)}`
      const cells = exp.cells ?? []
      return `<p class="mono">${exp.sourcePath ? `Source: ${escapeHtml(exp.sourcePath)}` : 'Sample data'}</p>
        <table><thead><tr>
          <th>Scenario</th><th>Provider</th><th>Model</th><th>Trial</th><th>Result</th><th>Graders</th>
        </tr></thead><tbody>${cells.map((c) => `
          <tr>
            <td>${escapeHtml(c.scenarioId)}</td>
            <td>${escapeHtml(c.provider)}</td>
            <td class="mono">${c.model ?? 'default'}</td>
            <td>${c.trial}</td>
            <td><span class="badge badge-${c.pass ? 'pass' : 'fail'}">${c.pass ? 'pass' : 'fail'}</span></td>
            <td class="mono">${Object.entries(c.graders ?? {}).map(([k,v]) => `${k}:${v}`).join(', ') || '—'}</td>
          </tr>`).join('')}</tbody></table>`
    }

    function renderDatasetsList() {
      return `<table><thead><tr><th>Name</th><th>Rows</th><th>Description</th></tr></thead><tbody>
        ${state.datasets.map((d) => `
          <tr class="clickable" data-dataset="${d.id}">
            <td>${escapeHtml(d.id)}</td>
            <td>${d.rows.length}</td>
            <td class="mono">${escapeHtml(d.description ?? '')}</td>
          </tr>`).join('')}
      </tbody></table>`
    }

    function renderDatasetDetail(id) {
      const ds = getDataset(id)
      if (!ds) return '<p>Dataset not found.</p>'
      document.getElementById('breadcrumb').innerHTML =
        `<button type="button" id="backDatasets">Datasets</button> / ${escapeHtml(ds.id)}`
      return `<p>${escapeHtml(ds.description ?? '')}</p>
        <table><thead><tr>
          <th></th><th>Input</th><th>Expected</th><th>Tags</th>
        </tr></thead><tbody>${ds.rows.map((r) => `
          <tr>
            <td><input type="checkbox" disabled /></td>
            <td class="mono">${escapeHtml(r.input)}</td>
            <td class="mono">${escapeHtml(r.expected)}</td>
            <td>${(r.tags ?? []).map((t) => `<span class="badge badge-kind">${escapeHtml(t)}</span>`).join(' ')}</td>
          </tr>`).join('')}</tbody></table>`
    }

    function renderCompare() {
      const [a, b] = [...compareIds].map(getExperiment)
      if (!a || !b) return ''
      return `<h2 style="font-size:16px;margin-top:24px">Compare: ${escapeHtml(a.name)} vs ${escapeHtml(b.name)}</h2>
        <table><thead><tr><th>Metric</th><th>${escapeHtml(a.name)}</th><th>${escapeHtml(b.name)}</th><th>Δ</th></tr></thead><tbody>
          <tr><td>Pass rate</td><td class="score-good">${pct(a.passRate)}</td><td class="score-good">${pct(b.passRate)}</td>
            <td class="${b.passRate >= a.passRate ? 'score-good' : 'score-bad'}">${pct(b.passRate - a.passRate)}</td></tr>
          <tr><td>Cells passed</td><td>${a.passCount}/${a.cellCount}</td><td>${b.passCount}/${b.cellCount}</td><td>—</td></tr>
        </tbody></table>`
    }

    function renderPlaceholder(name) {
      return `<p style="color:var(--muted);margin-top:24px">${name} is not wired in this mock. Use <strong>Experiments</strong> and <strong>Datasets</strong> for Rocket eval artifacts.</p>`
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    }

    function render() {
      const root = document.getElementById('viewRoot')
      document.getElementById('compareBanner').classList.toggle('visible', compareIds.size >= 1)
      document.getElementById('compareText').textContent =
        compareIds.size === 2 ? `Comparing ${compareIds.size} experiments` : `Selected ${compareIds.size}/2 for compare`
      document.getElementById('btnCompare').disabled = compareIds.size !== 2

      if (view === 'experiments') {
        document.getElementById('breadcrumb').textContent = ''
        root.innerHTML = renderExperimentsList() + (compareIds.size === 2 ? renderCompare() : '')
      } else if (view === 'experiment-detail') {
        root.innerHTML = renderExperimentDetail()
      } else if (view === 'datasets') {
        document.getElementById('breadcrumb').textContent = ''
        root.innerHTML = renderDatasetsList()
      } else if (view === 'dataset-detail') {
        root.innerHTML = renderDatasetDetail(selectedExperimentId)
      } else {
        document.getElementById('breadcrumb').textContent = ''
        root.innerHTML = renderPlaceholder(view)
      }
      bindRows()
    }

    function bindRows() {
      document.querySelectorAll('[data-exp]').forEach((el) => {
        el.addEventListener('click', () => {
          selectedExperimentId = el.dataset.exp
          setView('experiment-detail')
        })
      })
      document.querySelectorAll('[data-dataset]').forEach((el) => {
        el.addEventListener('click', () => {
          selectedExperimentId = el.dataset.dataset
          setView('dataset-detail')
        })
      })
      document.querySelectorAll('[data-compare]').forEach((el) => {
        el.addEventListener('change', () => {
          const id = el.dataset.compare
          if (el.checked) {
            if (compareIds.size >= 2) compareIds.clear()
            compareIds.add(id)
          } else compareIds.delete(id)
          render()
        })
      })
      document.getElementById('backExperiments')?.addEventListener('click', () => setView('experiments'))
      document.getElementById('backDatasets')?.addEventListener('click', () => setView('datasets'))
    }

    document.querySelectorAll('.nav-link').forEach((el) => {
      el.addEventListener('click', () => {
        selectedExperimentId = null
        setView(el.dataset.view)
      })
    })

    document.querySelectorAll('[data-layout]').forEach((el) => {
      el.addEventListener('click', () => {
        layout = el.dataset.layout
        document.querySelectorAll('[data-layout]').forEach((c) => c.classList.toggle('active', c.dataset.layout === layout))
        render()
      })
    })

    document.getElementById('expFilter').addEventListener('input', render)
    document.getElementById('btnCompare').addEventListener('click', render)
    document.getElementById('btnClearCompare').addEventListener('click', () => { compareIds.clear(); render() })
    document.getElementById('btnNewExperiment').addEventListener('click', () => {
      alert('In Rocket: npm run eval:matrix:plan && ROCKET_EVAL_MATRIX_RUN=1 npm run eval:matrix:run -- <manifest> --yes\nThen: npm run eval:mock-ui:sync')
    })
    document.getElementById('btnSyncHint').addEventListener('click', () => {
      loadData().then((d) => { state = d; render() })
    })
    document.getElementById('fileLoad').addEventListener('change', async (ev) => {
      const file = ev.target.files?.[0]
      if (!file) return
      state = JSON.parse(await file.text())
      render()
    })

    loadData().then((d) => { state = d; render() })
  </script>
</body>
